apiVersion: batch/v1
kind: Job

metadata:
  name: prisma-migrate

spec:
  backoffLimit: 1
  
  template:
    spec:
      restartPolicy: Never

      containers:
        - name: migrate
          image: job-tracker-backend:local
          imagePullPolicy: IfNotPresent    
          command: ["pnpm", "exec", "prisma", "migrate", "deploy"]

          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: DATABASE_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@postgres:5432/job_tracker?schema=public"