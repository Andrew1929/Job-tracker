apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  
spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: job-tracker-backend:local
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3001
            
          env:
            - name: NODE_ENV
              value: "production"

            - name: PORT
              value: "3001"

            - name: CORS_ORIGIN
              value: "http://localhost:3000"

            - name: REDIS_URL
              value: "redis://redis:6379"

            - name: NOTIFICATION_QUEUE_ENABLED
              value: "true"

            - name: JWT_ACCESS_EXPIRES_IN
              value: "15m"

            - name: JWT_REFRESH_EXPIRES_IN
              value: "30d"

            - name: BCRYPT_ROUNDS
              value: "12"

            - name: AUTH_USE_COOKIES
              value: "false"

            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_ACCESS_SECRET

            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_REFRESH_SECRET

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: DATABASE_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@postgres:5432/job_tracker?schema=public"

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
